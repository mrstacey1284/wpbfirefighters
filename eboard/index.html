<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Executive Board | West Palm Beach Firefighters — IAFF Local 727</title>
  <meta name="description" content="Contact the IAFF Local 727 Executive Board." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="contact-card-only eboard-listing-body">
  <main class="eboard-listing-solo">
    <div class="container">
      <div class="eboard-listing-brand">
        <img src="/assets/eboard/iaff-card-logo.png" alt="IAFF" width="280" height="140" />
        <h1>EXECUTIVE BOARD</h1>
      </div>
      <div class="eboard-grid">
        <a class="eboard-card" href="/eboard/president/">
          <div class="eboard-card-photo">
            <img src="/assets/eboard/president.jpg" alt="Brian Lamb" width="400" height="400" />
          </div>
          <div class="eboard-card-body">
            <p class="eboard-role">President</p>
            <h2>Brian Lamb</h2>
          </div>
        </a>
        <a class="eboard-card" href="/eboard/evp/">
          <div class="eboard-card-photo">
            <img src="/assets/eboard/evp.jpg" alt="Ryan Stacey" width="400" height="400" />
          </div>
          <div class="eboard-card-body">
            <p class="eboard-role">Executive Vice President</p>
            <h2>Ryan Stacey</h2>
          </div>
        </a>
        <a class="eboard-card" href="/eboard/treasurer/">
          <div class="eboard-card-photo">
            <img src="/assets/eboard/treasurer.jpg" alt="Daniel Rosales" width="400" height="400" />
          </div>
          <div class="eboard-card-body">
            <p class="eboard-role">Secretary/Treasurer</p>
            <h2>Daniel Rosales</h2>
          </div>
        </a>
        <a class="eboard-card" href="/eboard/dvp-north/">
          <div class="eboard-card-photo">
            <img src="/assets/eboard/dvp-north.jpg" alt="Patryk Mierzejewski" width="400" height="400" />
          </div>
          <div class="eboard-card-body">
            <p class="eboard-role">District Vice President</p>
            <h2>Patryk Mierzejewski</h2>
          </div>
        </a>
        <a class="eboard-card" href="/eboard/dvp-south/">
          <div class="eboard-card-photo">
            <img src="/assets/eboard/dvp-south.jpg" alt="Bobby Bennett" width="400" height="400" />
          </div>
          <div class="eboard-card-body">
            <p class="eboard-role">District Vice President</p>
            <h2>Bobby Bennett</h2>
          </div>
        </a>
        <a class="eboard-card" href="/eboard/dvp-west/">
          <div class="eboard-card-photo">
            <img src="/assets/eboard/dvp-west.jpg" alt="Bryan Lee" width="400" height="400" />
          </div>
          <div class="eboard-card-body">
            <p class="eboard-role">District Vice President</p>
            <h2>Bryan Lee</h2>
          </div>
        </a>
      </div>
    </div>
  </main>

</html>
