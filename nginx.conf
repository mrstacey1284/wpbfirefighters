server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run terminates TLS and proxies to this port. Default absolute
    # redirects advertise :8080 (live /eboard already does), which browsers cannot open.
    absolute_redirect off;
    port_in_redirect off;

    # Directory URLs without a slash otherwise 301. Serve the page directly
    # so /amendment3 and /amendment3/ are both 200.
    location = /amendment3 {
        try_files /amendment3/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
